name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      # Specs create throwaway git repositories and run the built CLI; git is on the runner.
      - run: pnpm test
      - run: pnpm run build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report
          path: .jest-report.json
          if-no-files-found: ignore
          retention-days: 7
